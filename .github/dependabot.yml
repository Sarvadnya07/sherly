# OE-6 / FS-#34: Dependabot configuration
# Automatically opens PRs for dependency updates (pip) and GitHub Actions.

version: 2
updates:
  # Python package dependencies (pyproject.toml)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "deps"
    ignore:
      # Don't auto-update PySide6 — major version bumps can break UI
      - dependency-name: "PySide6"
        update-types: ["version-update:semver-major"]

  # GitHub Actions version updates
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "ci"
