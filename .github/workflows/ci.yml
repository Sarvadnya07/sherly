name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies (incl. dev extras for pytest)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Verify Python compilation
        run: |
          python -m compileall -q .

      - name: Run Ruff lint
        run: |
          pip install ruff
          ruff check backend core sherly_core sherly_ai sherly_commands agents tools remote_api remote_agent tests

      - name: Run PyTest Test Suite
        run: |
          pytest tests/ -q

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build Frontend Production Assets
        working-directory: frontend
        run: |
          npm run build
