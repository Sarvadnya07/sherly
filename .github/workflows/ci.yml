name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Verify Python compilation
        run: |
          python -m compileall -q .

      - name: Run Ruff lint
        run: |
          pip install ruff
          ruff check backend core sherly_core agents tools remote_api remote_agent tests *.py

      - name: Package smoke test (wheel completeness)
        run: |
          pip install build
          python -m build --wheel --outdir dist_ci .
          python - << 'EOF'
          import sys, zipfile, glob
          wheel = glob.glob("dist_ci/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = [
              "action_manager.py", "command_router.py", "safety_guard.py",
              "model_manager.py", "runtime_utils.py",
              "backend/api/routes/files.py", "backend/api/routes/actions.py",
              "backend/main.py", "tools/terminal_tools.py", "tools/executor.py",
              "core/network_security.py", "remote_agent/agent.py",
          ]
          missing = [m for m in required if m not in names]
          if missing:
              sys.exit(f"PKG-001 wheel smoke check FAILED, missing: {missing}")
          print("Wheel package smoke check passed:", wheel)
          EOF

      - name: Run PyTest Test Suite
        run: |
          pytest tests/ -q

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build Frontend Production Assets
        working-directory: frontend
        run: |
          npm run build
