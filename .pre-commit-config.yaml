# OE-2 / FS-#32: Pre-commit hooks for Sherly AI
# Install: pip install pre-commit && pre-commit install

repos:
  # ── Ruff: lint + auto-fix ──────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(src|tests)/

  # ── Bandit: security scan ─────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args:
          - -r
          - src/
          - --skip
          - B101,B404,B603  # Skip assert, subprocess (we use shlex/shell=False), shell calls
        files: ^src/

  # ── General file hygiene ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key       # Catches raw API keys accidentally committed
      - id: mixed-line-ending
        args: [--fix=lf]
