[project]
name = "sherly-ai"
version = "0.1.0"
description = "A professional-grade agentic AI assistant for desktop and development automation."
dependencies = [
    "pystray>=0.19.5",
    "Pillow>=12.2.0",
    "faster-whisper>=1.2.1",
    "sounddevice>=0.5.5",
    "numpy>=2.0.0",
    "scipy>=1.15.0",
    "pyttsx3>=2.99",
    "requests>=2.33.1",
    "duckduckgo-search>=8.1.1",
    "pyautogui>=0.9.54",
    "pyperclip>=1.11.0",
    "mss>=10.1.0",
    "PySide6>=6.11.0",
    "tenacity>=9.1.4",
    "fastapi>=0.136.0",
    "uvicorn>=0.45.0",
    "pynput>=1.8.1",
    "python-dotenv>=1.2.2",
    "psutil>=7.2.2",
    "chromadb>=0.4.24",
    "cryptography>=42.0.5",
    "pygetwindow>=0.0.9",
    "keyboard>=0.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0",
]
extras = [
    "structlog>=24.1.0",        # JSON structured logging (FS-#9)
    "sqlalchemy>=2.0.0",        # PostgreSQL adapter (FS-#16)
    "psycopg2-binary>=2.9.0",   # PostgreSQL driver (FS-#16)
    "websockets>=12.0",         # Cloud relay WebSocket (FS-#14)
    "celery>=5.3.0",            # Distributed task queue (FS-#18)
    "redis>=5.0.0",             # Celery broker (FS-#18)
    "wasmtime>=21.0.0",         # WASM sandbox Tier-1 (FS-#11)
    "winsdk>=1.0.0b10",         # Windows Hello biometrics (RC-2)
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
