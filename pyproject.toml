[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sherly-ai"
version = "2.0.0"
description = "Autonomous Local Developer Orchestrator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sarvadnya", email = "sarvadnya@example.com" }
]
dependencies = [
    # Core API & Networking
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    
    # Utilities & Search
    "ddgs>=9.0.0",
    "duckduckgo-search>=8.1.0",
    "tenacity>=9.1.0",
    
    # Desktop Automation & Screen
    "pyperclip>=1.11.0",
    "Pillow>=12.3.0",
    "mss>=10.2.0",
    "pynput>=1.8.0",
    "pyautogui>=0.9.50",
    "playwright>=1.62.0",

    # AI & Voice Native
    "sounddevice>=0.5.0",
    "numpy>=2.5.0,<3.0",
    "faster-whisper>=1.2.0",
    "pyttsx3>=2.99",
    "pvporcupine>=4.0.0",
    "pyaudio>=0.2.14",
    
    # Legacy UI
    "PySide6>=6.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.0",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
]

[tool.setuptools]
packages = ["agents", "backend", "core", "sherly_ai", "sherly_commands", "sherly_core", "sherly_ui", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 120
target-version = "py310"
