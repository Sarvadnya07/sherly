[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sherly-ai"
version = "2.0.0"
description = "Autonomous Local Developer Orchestrator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sarvadnya", email = "sarvadnya@example.com" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "httpx>=0.24.0",
    "duckduckgo-search>=6.0.0",
    "pyperclip>=1.8.0",
    "Pillow>=10.0.0",
    "sounddevice>=0.4.0",
    "numpy>=1.24.0",
    "faster-whisper>=1.0.0",
    "pyttsx3>=2.90",
    "pynput>=1.7.0",
    "PySide6>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 120
target-version = "py310"
