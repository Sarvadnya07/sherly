[project]
name = "sherly-ai"
version = "0.1.0"
description = "A professional-grade agentic AI assistant for desktop and development automation."
dependencies = [
    "pystray>=0.19.5",
    "Pillow>=12.2.0",
    "faster-whisper>=1.2.1",
    "sounddevice>=0.5.5",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
    "pyttsx3>=2.99",
    "requests>=2.33.1",
    "duckduckgo-search>=8.1.1",
    "pyautogui>=0.9.54",
    "pyperclip>=1.11.0",
    "mss>=10.1.0",
    "PySide6>=6.11.0",
    "tenacity>=9.1.4",
    "fastapi>=0.136.0",
    "uvicorn>=0.45.0",
    "pynput>=1.8.1",
    "python-dotenv>=1.2.2",
    "psutil>=7.2.2",
    "chromadb>=0.4.24",
    "cryptography>=42.0.5",
    "pygetwindow>=0.0.9",
    "keyboard>=0.13.5",
]

[tool.setuptools]
packages = {find = {}}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
